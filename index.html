<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

/* =====================================================================
   LAPISAN ADAPTER
   UI di bawah HANYA memanggil fungsi-fungsi ini — tidak pernah menyentuh
   Supabase langsung. Ganti isi objek `adapter` untuk pindah mode:
     - 'demo'      : in-memory, tanpa Supabase, untuk uji coba/presentasi
     - 'standalone': Supabase project sendiri (tabel Bagian A di skema)
     - 'amanah'    : menempel ke tabel Amanah yang sudah ada
   ===================================================================== */

const APP_MODE = 'amanah'; // MIN 8 Kota Banda Aceh — menempel ke Supabase Amanah

// Kredensial Supabase project Amanah (aman dipakai di sisi client —
// dilindungi RLS, BUKAN service_role key).
const SUPABASE_URL = 'https://djnbttyjyzknujrepdfe.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_2NM4R5w9VxxHITH8GZ642w_ADTYV1sW';

const HABITS = [
  { code:'bangun_pagi', name:'Bangun Pagi', icon:'🌅', bg:'var(--gold-100)', iconBg:'var(--gold-200)', text:'var(--gold-800)', kbc:'Disiplin diri', domain:'rumah', pertanyaan:'Hari ini kamu bangun pagi dengan semangat?', badge:'Sahabat Bangun Pagi' },
  { code:'beribadah', name:'Beribadah', icon:'🤲', bg:'var(--teal-100)', iconBg:'#BFE0D7', text:'var(--teal-700)', kbc:'Cinta kepada Tuhan', domain:'rumah', pertanyaan:'Hari ini kamu menjaga ibadahmu?', badge:'Pembiasaan Ibadah' },
  { code:'berolahraga', name:'Berolahraga', icon:'🏃', bg:'var(--rust-100)', iconBg:'#EAC6AE', text:'var(--rust-700)', kbc:'Amanah jasmani', domain:'keduanya', pertanyaan:'Hari ini kamu bergerak dan berolahraga?', badge:'Anak Aktif' },
  { code:'makan_sehat', name:'Makan Sehat & Bergizi', icon:'🥗', bg:'var(--sage-100)', iconBg:'#CFE0B9', text:'var(--sage-700)', kbc:'Syukur', domain:'rumah', pertanyaan:'Hari ini kamu makan makanan sehat dan bergizi?', badge:'Pahlawan Makanan Sehat' },
  { code:'gemar_belajar', name:'Gemar Belajar', icon:'📚', bg:'var(--paper)', iconBg:'var(--paper-2)', text:'var(--ink-soft)', kbc:'Cinta ilmu', domain:'madrasah', pertanyaan:'Hari ini kamu meluangkan waktu untuk belajar?', badge:'Pejuang Belajar' },
  { code:'bermasyarakat', name:'Bermasyarakat', icon:'🤝', bg:'var(--rust-100)', iconBg:'#EAC6AE', text:'var(--rust-700)', kbc:'Cinta sesama', domain:'madrasah', pertanyaan:'Hari ini kamu berbuat baik kepada sesama?', badge:'Sahabat Sesama' },
  { code:'tidur_cepat', name:'Tidur Cepat', icon:'😴', bg:'var(--teal-100)', iconBg:'#BFE0D7', text:'var(--teal-700)', kbc:'Keseimbangan diri', domain:'rumah', pertanyaan:'Hari ini kamu tidur lebih awal?', badge:'Tidur Teratur' },
];

// Kebiasaan yang relevan untuk masing-masing peran pencatat
const habitsForDomain = (roleDomain) => HABITS.filter(h => h.domain === roleDomain || h.domain === 'keduanya');

// Ambang konsistensi untuk lencana per kebiasaan tercapai
const BADGE_THRESHOLD = 80;
// Nama lencana gabungan kalau semua kebiasaan rata-rata di atas ambang
const META_BADGE = { name:'Aneuk Hebat', icon:'🏅' };

// Pilihan reflektif untuk modal siswa — 3 tingkat, dibahasakan personal
const REFLEKSI_OPSI = [
  { status:'sudah_terbiasa', label:'Sudah', desc:'Aku sudah melakukannya hari ini!', icon:'☀️', color:'var(--green-600)' },
  { status:'perlu_pendampingan', label:'Kadang', desc:'Terkadang aku melakukannya.', icon:'🙂', color:'var(--gold-600)' },
  { status:'belum_terbiasa', label:'Belum', desc:'Aku belum melakukannya hari ini.', icon:'💭', color:'var(--rust-500)' },
];

// Misi harian — tantangan terukur per kebiasaan, terpisah dari jurnal
// utama. Dalam skema Supabase ini merujuk ke tabel misi_harian/misi_selesai.
const MISI_HARIAN = [
  { id:'m1', kebiasaanCode:'bangun_pagi', judul:'Bangun Pagi', deskripsi:'Bangun sebelum jam 05.30', icon:'🌅' },
  { id:'m2', kebiasaanCode:'gemar_belajar', judul:'Luangkan waktu untuk belajar', deskripsi:'Belajar minimal 15 menit', icon:'📚' },
  { id:'m3', kebiasaanCode:'berolahraga', judul:'Bergerak dan berolahraga', deskripsi:'Olahraga ringan minimal 10 menit', icon:'🏃' },
  { id:'m4', kebiasaanCode:'bermasyarakat', judul:'Lakukan satu kebaikan untuk orang lain', deskripsi:'Bantu teman atau keluarga', icon:'🤝' },
];
const TARGET_TANTANGAN_MINGGUAN = 5;

// Sub-item rincian Ibadah — lapisan opsional, TIDAK menggantikan status
// utama kebiasaan 'beribadah'. Hanya untuk pencatatan mandiri siswa/ortu,
// tidak muncul di grid massal Guru (biar beban observasi tidak bertambah).
const SUB_IBADAH = [
  { code:'shalat_berjamaah', nama:'Shalat 5 Waktu Berjamaah', icon:'🕌' },
  { code:'shalat_dhuha', nama:'Shalat Dhuha', icon:'🌤️' },
  { code:'baca_quran', nama:"Membaca Al-Qur'an", icon:'📖' },
  { code:'sedekah', nama:'Bersedekah', icon:'🤲' },
];

// Tingkat (level) siswa berdasarkan total catatan — label dibahasakan
// KBC, bukan sekadar "Level 1/2/3" polos.
const LEVEL_SISWA = [
  { min:0, label:'Pemula', icon:'🌱' },
  { min:20, label:'Rajin', icon:'🌿' },
  { min:50, label:'Istiqomah', icon:'🌳' },
  { min:100, label:'Teladan', icon:'🌟' },
];
const getLevelSiswa = (totalCatatan) => {
  let current = LEVEL_SISWA[0];
  for (const lvl of LEVEL_SISWA) { if (totalCatatan >= lvl.min) current = lvl; }
  return current;
};

// Skala 3 tingkat — dipakai konsisten di seluruh sistem (guru pakai penuh
// lewat grid; siswa/ortu pakai versi sederhana 2 tombol yang otomatis
// memetakan ke 'sudah_terbiasa' / 'belum_terbiasa', melewati status tengah).
const STATUS_LEVELS = [
  { value:'belum_terbiasa', color:'#E0654A', label:'Belum' },
  { value:'perlu_pendampingan', color:'#D4A64C', label:'Perlu dampingan' },
  { value:'sudah_terbiasa', color:'#3D8B6E', label:'Sudah terbiasa' },
];
const nextStatus = (current) => {
  const idx = STATUS_LEVELS.findIndex(s => s.value === current);
  return STATUS_LEVELS[(idx + 1) % STATUS_LEVELS.length].value;
};

// Format nama kelas dari tingkat + paralel. Kelas Amanah yang belum
// dibagi paralelnya diisi teks panjang "Belum Dibagi", bukan huruf
// tunggal seperti "A" -- jadi digabung dempet ("1Belum Dibagi") kalau
// asal concat. Kalau paralel-nya pendek (huruf/angka biasa), gabung
// tanpa spasi seperti biasa ("1A"); kalau panjang, pisah rapi ("Kelas 1 (Belum Dibagi)").
const formatKelas = (tingkat, paralel) => {
  if (!tingkat) return '';
  if (!paralel) return `${tingkat}`;
  if (paralel.length <= 2) return `${tingkat}${paralel}`;
  return `${tingkat} (${paralel})`;
};

function makeDemoAdapter(){
  // Coba pakai penyimpanan persisten Claude (window.storage) kalau tersedia.
  // Kalau file ini dibuka di luar lingkungan Claude (didownload, dibuka
  // langsung di browser), otomatis jatuh ke penyimpanan sementara di memori.
  const hasPersistentStorage = typeof window !== 'undefined' && window.storage;
  let memoryFallback = {};

  const todayKey = () => new Date().toISOString().slice(0,10);

  async function readDay(studentId, date){
    const key = `entries:${studentId}:${date}`;
    if (hasPersistentStorage){
      try {
        const res = await window.storage.get(key);
        return res ? JSON.parse(res.value) : {};
      } catch (e) {
        return {};
      }
    }
    return memoryFallback[key] || {};
  }

  async function writeDay(studentId, date, data){
    const key = `entries:${studentId}:${date}`;
    if (hasPersistentStorage){
      try {
        await window.storage.set(key, JSON.stringify(data));
        return;
      } catch (e) { /* fallback di bawah kalau gagal */ }
    }
    memoryFallback[key] = data;
  }

  async function readMisi(studentId, date){
    const key = `misi:${studentId}:${date}`;
    if (hasPersistentStorage){
      try {
        const res = await window.storage.get(key);
        return res ? JSON.parse(res.value) : [];
      } catch (e) {
        return [];
      }
    }
    return memoryFallback[key] || [];
  }

  async function writeMisi(studentId, date, arr){
    const key = `misi:${studentId}:${date}`;
    if (hasPersistentStorage){
      try {
        await window.storage.set(key, JSON.stringify(arr));
        return;
      } catch (e) { /* fallback di bawah kalau gagal */ }
    }
    memoryFallback[key] = arr;
  }

  async function readSubIbadah(studentId, date){
    const key = `subibadah:${studentId}:${date}`;
    if (hasPersistentStorage){
      try {
        const res = await window.storage.get(key);
        return res ? JSON.parse(res.value) : {};
      } catch (e) {
        return {};
      }
    }
    return memoryFallback[key] || {};
  }

  async function writeSubIbadah(studentId, date, obj){
    const key = `subibadah:${studentId}:${date}`;
    if (hasPersistentStorage){
      try {
        await window.storage.set(key, JSON.stringify(obj));
        return;
      } catch (e) { /* fallback di bawah kalau gagal */ }
    }
    memoryFallback[key] = obj;
  }

  return {
    mode: 'demo',
    persistent: !!hasPersistentStorage,
    needsInstitutionPick: false, // demo cukup 1 lembaga contoh, langsung lanjut
    async setMadrasahId(id){ /* tidak relevan di mode demo */ },
    async listInstitutions(){
      return [{ id:'demo-1', nama:'MIN 8 Kota Banda Aceh (contoh)', jenjang:'MI' }];
    },
    async listStudentsByName(institutionId, query){
      const all = [
        { id:'s1', full_name:'Aisyah Fitri', class_name:'VIII-A', jenjang:'MTs' },
        { id:'s2', full_name:'M. Rizki Ramadhan', class_name:'VIII-A', jenjang:'MTs' },
        { id:'s3', full_name:'Fauzan Ridho', class_name:'III-B', jenjang:'MI' },
      ];
      return all.filter(s => s.full_name.toLowerCase().includes((query||'').toLowerCase()));
    },
    async listParentsByPhone(phone){
      // Demo: satu nomor contoh terhubung ke dua anak
      const parents = [
        { id:'p1', full_name:'Bunda Fauzan & Zahra', phone:'0812xxxxxxx',
          children:[
            { id:'s3', full_name:'Fauzan Ridho', class_name:'III-B', jenjang:'MI' },
            { id:'s4', full_name:'Zahra Amelia', class_name:'V-A', jenjang:'MI' },
          ]
        }
      ];
      if (!phone) return parents[0];

      let streak = 0;

      // (bukan seluruh 30 hari), berapa persen berstatus sudah_terbiasa.
      const tally = {};
      HABITS.forEach(h => { tally[h.code] = { sudah:0, total:0 }; });
      let cursor = new Date();
      let totalCatatan = 0;
      let hariAktif = 0;
      for (let i = 0; i < 30; i++){
        const dateStr = cursor.toISOString().slice(0,10);
        const stored = await readDay(studentId, dateStr);
        const keys = Object.keys(stored);
        if (keys.length > 0) hariAktif++;
        keys.forEach(code => {
          if (!tally[code]) return;
          tally[code].total++;
          totalCatatan++;
          if (stored[code] === 'sudah_terbiasa') tally[code].sudah++;
        });
        cursor.setDate(cursor.getDate() - 1);
      }
      const consistency = {};
      HABITS.forEach(h => {
        const t = tally[h.code];
        consistency[h.code] = t.total > 0 ? Math.round((t.sudah / t.total) * 100) : 0;
      });
      return { consistency, totalCatatan, hariAktif };

// Adapter Amanah -- membaca tabel Amanah asli (madrasah/siswa/kelas/pegawai)
// dan tabel tambahan yang kita buat lewat si-aneuk-hebat-schema-amanah.sql
// (kebiasaan/jurnal_kebiasaan/sub_kebiasaan/dst). Single-tenant untuk pilot
// ini -- madrasah_id diambil sekali dari baris madrasah pertama dan di-cache.
function makeAmanahAdapter(supabaseClient){
  // Amanah bersifat multi-tenant (satu project Supabase menampung banyak
  // madrasah/sekolah -- MIN 8 Kota Banda Aceh, MTsN 1 Banda Aceh, SD
  // Negeri Lambada Klieng, dan berpotensi lembaga lain menyusul). Karena
  // itu madrasah_id TIDAK di-hardcode -- harus dipilih dulu lewat
  // setMadrasahId() sebelum fungsi lain dipakai (lihat InstitutionPicker).
  let cachedMadrasahId = null;
  let kodeToId = null;   // { bangun_pagi: 'uuid', ... }
  let idToKode = null;   // { 'uuid': 'bangun_pagi', ... }
  let subKodeToId = null;
  let subIdToKode = null;

  async function getMadrasahId(){
    if (!cachedMadrasahId) throw new Error('Lembaga belum dipilih -- panggil adapter.setMadrasahId() dulu.');
    return cachedMadrasahId;
  }

  async function getKebiasaanMap(){
    if (kodeToId) return { kodeToId, idToKode };
    const { data } = await supabaseClient.from('kebiasaan').select('id, kode');
    kodeToId = {}; idToKode = {};
    (data || []).forEach(k => { kodeToId[k.kode] = k.id; idToKode[k.id] = k.kode; });
    return { kodeToId, idToKode };
  }

  async function getSubKebiasaanMap(){
    if (subKodeToId) return { subKodeToId, subIdToKode };
    const { data } = await supabaseClient.from('sub_kebiasaan').select('id, kode');
    subKodeToId = {}; subIdToKode = {};
    (data || []).forEach(s => { subKodeToId[s.kode] = s.id; subIdToKode[s.id] = s.kode; });
    return { subKodeToId, subIdToKode };
  }

  const todayKey = () => new Date().toISOString().slice(0,10);
  const daysAgoKey = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0,10); };

  return {
    mode: 'amanah',
    persistent: true,
    needsInstitutionPick: true,
    async setMadrasahId(id){ cachedMadrasahId = id; },
    async listInstitutions(){
      const { data } = await supabaseClient.from('madrasah').select('id, nama, jenjang, kabupaten_kota').order('nama');
      return data || [];
    },
    async listKelasForMadrasah(){
      const madrasahId = await getMadrasahId();
      const { data, error } = await supabaseClient.from('v_kelas_publik')
        .select('id, tingkat, paralel, wali_kelas_id').eq('madrasah_id', madrasahId).order('tingkat').order('paralel');
      if (error) { console.error(error); return []; }
      return data || [];
    },
    async getAnalisisKelas(kelasId){
      const madrasahId = await getMadrasahId();
      const { idToKode } = await getKebiasaanMap();

      let jumlahSiswa = 0;
      let siswaIds = null; // null = tidak difilter per-siswa, langsung pakai madrasah_id

      if (kelasId){
        const { data: siswaRows } = await supabaseClient.from('v_siswa_login')
          .select('id').eq('madrasah_id', madrasahId).eq('kelas_id', kelasId);
        siswaIds = (siswaRows || []).map(s => s.id);
        jumlahSiswa = siswaIds.length;
      } else {
        // Hitung jumlah siswa TANPA menarik semua 904 barisnya -- cukup count.
        const { count } = await supabaseClient.from('v_siswa_login')
          .select('id', { count: 'exact', head: true }).eq('madrasah_id', madrasahId);
        jumlahSiswa = count || 0;
      }

      if (jumlahSiswa === 0){
        return { jumlahSiswa: 0, kelengkapanHariIni: 0, kebiasaanPersen: {}, tertinggi: null, terlemah: null };
      }

      // Kelengkapan hari ini: berapa % dari (siswa x 7 kebiasaan) yang punya
      // catatan hari ini -- terpisah dari kualitas kebiasaan, sesuai temuan
      // SI-7KAIH (jangan sampai "sepi lapor" ketuker jadi "kebiasaan buruk").
      const today = todayKey();
      const todayQuery = siswaIds
        ? supabaseClient.from('jurnal_kebiasaan').select('siswa_id, kebiasaan_id').in('siswa_id', siswaIds).eq('tanggal', today)
        : supabaseClient.from('jurnal_kebiasaan').select('siswa_id, kebiasaan_id').eq('madrasah_id', madrasahId).eq('tanggal', today);
      const { data: todayRows, error: todayErr } = await todayQuery;
      if (todayErr) console.error('getAnalisisKelas (hari ini):', todayErr);
      const uniqueTodayPairs = new Set((todayRows || []).map(r => `${r.siswa_id}_${r.kebiasaan_id}`));
      const kelengkapanHariIni = Math.round((uniqueTodayPairs.size / (jumlahSiswa * HABITS.length)) * 100);

      // Persentase per kebiasaan (30 hari terakhir) -- untuk radar chart
      const monthQuery = siswaIds
        ? supabaseClient.from('jurnal_kebiasaan').select('kebiasaan_id, status').in('siswa_id', siswaIds).gte('tanggal', daysAgoKey(30))
        : supabaseClient.from('jurnal_kebiasaan').select('kebiasaan_id, status').eq('madrasah_id', madrasahId).gte('tanggal', daysAgoKey(30));
      const { data: monthRows, error: monthErr } = await monthQuery;
      if (monthErr) console.error('getAnalisisKelas (30 hari):', monthErr);
      const tally = {};
      HABITS.forEach(h => { tally[h.code] = { sudah:0, total:0 }; });
      (monthRows || []).forEach(row => {
        const kode = idToKode[row.kebiasaan_id];
        if (!kode || !tally[kode]) return;
        tally[kode].total++;
        if (row.status === 'sudah_terbiasa') tally[kode].sudah++;
      });
      const kebiasaanPersen = {};
      HABITS.forEach(h => {
        const t = tally[h.code];
        kebiasaanPersen[h.code] = t.total > 0 ? Math.round((t.sudah / t.total) * 100) : 0;
      });

      let tertinggi = null, terlemah = null;
      HABITS.forEach(h => {
        const p = kebiasaanPersen[h.code];
        if (!tertinggi || p > tertinggi.persen) tertinggi = { kode: h.code, persen: p };
        if (!terlemah || p < terlemah.persen) terlemah = { kode: h.code, persen: p };
      });

      return { jumlahSiswa, kelengkapanHariIni, kebiasaanPersen, tertinggi, terlemah };
    },
    async getRekapBulanan(kelasId, bulan, tahun){
      const madrasahId = await getMadrasahId();
      const { idToKode } = await getKebiasaanMap();

      // Rentang tanggal awal-akhir bulan (bulan: 1-12)
      const awal = `${tahun}-${String(bulan).padStart(2,'0')}-01`;
      const akhirDate = new Date(tahun, bulan, 0); // hari terakhir bulan itu
      const akhir = akhirDate.toISOString().slice(0,10);

      let rows;
      if (kelasId){
        // Per kelas: perlu daftar siswa dulu (jumlahnya kecil, aman pakai .in())
        const { data: siswaRows } = await supabaseClient.from('v_siswa_login')
          .select('id').eq('madrasah_id', madrasahId).eq('kelas_id', kelasId);
        const siswaIds = (siswaRows || []).map(s => s.id);
        if (siswaIds.length === 0) return { indeks: 0, perHabit: HABITS.map(h => ({ kode:h.code, nama:h.name, icon:h.icon, sudah:0, total:0, persen:0 })) };
        const { data, error } = await supabaseClient.from('jurnal_kebiasaan')
          .select('kebiasaan_id, status').in('siswa_id', siswaIds).gte('tanggal', awal).lte('tanggal', akhir);
        if (error) console.error('getRekapBulanan (per kelas):', error);
        rows = data;
      } else {
        // Semua kelas: filter LANGSUNG lewat madrasah_id di jurnal_kebiasaan,
        // TIDAK lewat daftar ID siswa (bisa ratusan/ribuan -- URL query jadi
        // kepanjangan dan gagal diam-diam kalau pakai .in() dengan list besar).
        const { data, error } = await supabaseClient.from('jurnal_kebiasaan')
          .select('kebiasaan_id, status').eq('madrasah_id', madrasahId).gte('tanggal', awal).lte('tanggal', akhir);
        if (error) console.error('getRekapBulanan (semua kelas):', error);
        rows = data;
      }

      const tally = {};
      HABITS.forEach(h => { tally[h.code] = { sudah:0, total:0 }; });
      (rows || []).forEach(row => {
        const kode = idToKode[row.kebiasaan_id];
        if (!kode || !tally[kode]) return;
        tally[kode].total++;
        if (row.status === 'sudah_terbiasa') tally[kode].sudah++;
      });

      let totalSudah = 0, totalEntri = 0;
      const perHabit = HABITS.map(h => {
        const t = tally[h.code];
        totalSudah += t.sudah; totalEntri += t.total;
        return { kode:h.code, nama:h.name, icon:h.icon, sudah:t.sudah, total:t.total, persen: t.total>0?Math.round((t.sudah/t.total)*100):0 };
      });
      const indeks = totalEntri > 0 ? Math.round((totalSudah/totalEntri)*100) : 0;
      return { indeks, perHabit };
    },

    async getKanwilOverview(){
      // LINTAS-TENANT sengaja -- Kanwil melihat SEMUA madrasah di project,
      // TIDAK lewat getMadrasahId() (yang cuma untuk satu lembaga aktif).
      const { data: madrasahRows } = await supabaseClient.from('madrasah')
        .select('id, nama, jenjang, kabupaten_kota');
      const semuaMadrasah = madrasahRows || [];
      const totalMadrasah = semuaMadrasah.length;

      const { idToKode } = await getKebiasaanMap();
      const { data: jurnalRows, error } = await supabaseClient.from('jurnal_kebiasaan')
        .select('madrasah_id, kebiasaan_id, status');
      if (error) console.error('getKanwilOverview:', error);

      // Agregasi per madrasah
      const perMadrasah = {}; // madrasah_id -> { sudah, total, perHabit: {kode:{sudah,total}} }
      (jurnalRows || []).forEach(row => {
        if (!perMadrasah[row.madrasah_id]) perMadrasah[row.madrasah_id] = { sudah:0, total:0, perHabit:{} };
        const m = perMadrasah[row.madrasah_id];

          if (!m.perHabit[kode]) m.perHabit[kode] = { sudah:0, total:0 };
          m.perHabit[kode].total++;
          if (row.status === 'sudah_terbiasa') m.perHabit[kode].sudah++;

      const madrasahAktifLapor = Object.keys(perMadrasah).length;

      const rankingMadrasah = semuaMadrasah.map(m => {
        const agg = perMadrasah[m.id];
        const persenPartisipasi = agg && agg.total > 0 ? Math.round((agg.sudah / agg.total) * 100) : 0;
        let terlemahKode = null, terlemahPersen = 101;
        if (agg){
          Object.keys(agg.perHabit).forEach(kode => {
            const h = agg.perHabit[kode];
            const p = h.total > 0 ? Math.round((h.sudah / h.total) * 100) : 0;
            if (p < terlemahPersen){ terlemahPersen = p; terlemahKode = kode; }
          });
        }
        const habitObj = HABITS.find(h => h.code === terlemahKode);
        return {
          id: m.id, nama: m.nama, kabupaten_kota: m.kabupaten_kota, jenjang: m.jenjang,
          persenPartisipasi, kebiasaanTerlemah: habitObj ? habitObj.name : '-'
        };
      }).sort((a, b) => b.persenPartisipasi - a.persenPartisipasi);

      // Agregasi per kabupaten/kota
      const kabkotaMap = {};
      semuaMadrasah.forEach(m => {
        const kk = m.kabupaten_kota || 'Tidak diketahui';
        if (!kabkotaMap[kk]) kabkotaMap[kk] = { totalMadrasah:0, madrasahAktifLapor:0, sudah:0, total:0 };
        kabkotaMap[kk].totalMadrasah++;
        const agg = perMadrasah[m.id];
        if (agg){
          kabkotaMap[kk].madrasahAktifLapor++;
          kabkotaMap[kk].sudah += agg.sudah;
          kabkotaMap[kk].total += agg.total;
        }
      });
      const perKabkota = Object.keys(kabkotaMap).map(kk => {
        const d = kabkotaMap[kk];
        return {
          kabupaten_kota: kk, totalMadrasah: d.totalMadrasah, madrasahAktifLapor: d.madrasahAktifLapor,
          persenPartisipasi: d.total > 0 ? Math.round((d.sudah / d.total) * 100) : 0
        };
      }).sort((a, b) => b.persenPartisipasi - a.persenPartisipasi);

      return { totalMadrasah, madrasahAktifLapor, perKabkota, rankingMadrasah };
    },
    async listStudentsByName(institutionId, query, kelasId){
      const madrasahId = await getMadrasahId();
      let q = supabaseClient.from('v_siswa_login')
        .select('id, nama, jenjang, tingkat, paralel')
        .eq('madrasah_id', madrasahId)
        .ilike('nama', `%${query || ''}%`)
        .limit(60);
      if (kelasId) q = q.eq('kelas_id', kelasId);
      const { data, error } = await q;
      if (error) { console.error(error); return []; }
      return (data || []).map(s => ({
        id: s.id,
        full_name: s.nama,
        jenjang: s.jenjang,
        class_name: formatKelas(s.tingkat, s.paralel)
      }));
    },
    async listParentsByPhone(phone){
      const { data: linkRow, error } = await supabaseClient.from('ortu_siswa_link')
        .select('id, nama_ortu, telepon')
        .eq('telepon', phone)
        .limit(1).maybeSingle();
      if (error || !linkRow) return null;
      const { data: allLinks } = await supabaseClient.from('ortu_siswa_link')
        .select('siswa_id').eq('telepon', phone);
      const siswaIds = (allLinks || []).map(l => l.siswa_id);
      if (siswaIds.length === 0) return { id: linkRow.id, full_name: linkRow.nama_ortu, children: [] };
      const { data: siswaRows } = await supabaseClient.from('v_siswa_login')
        .select('id, nama, jenjang, tingkat, paralel').in('id', siswaIds);
      const children = (siswaRows || []).map(s => ({
        id: s.id, full_name: s.nama, jenjang: s.jenjang,
        class_name: formatKelas(s.tingkat, s.paralel)
      }));
      return { id: linkRow.id, full_name: linkRow.nama_ortu, children };
    },
    async listClassRoster(classId){
      const madrasahId = await getMadrasahId();
      let q = supabaseClient.from('v_siswa_login').select('id, nama').eq('madrasah_id', madrasahId).limit(40);
      if (classId) q = q.eq('kelas_id', classId);
      const { data } = await q;
      return (data || []).map(s => ({ id: s.id, full_name: s.nama }));
    },
    async listPegawai(query){
      const madrasahId = await getMadrasahId();
      const { data } = await supabaseClient.from('pegawai')
        .select('id, nama, nip_nik, jabatan, role')
        .eq('madrasah_id', madrasahId)
        .ilike('nama', `%${query || ''}%`)
        .order('nama')
        .limit(200);
      return (data || []).map(p => ({ id:p.id, nama:p.nama, jabatan:p.jabatan, role:p.role }));
    },
    async getTodayEntries(studentId){
      return this.getEntriesForDate(studentId, todayKey());
    },
    async getEntriesForDate(studentId, dateStr){
      const { idToKode } = await getKebiasaanMap();
      const { data } = await supabaseClient.from('jurnal_kebiasaan')
        .select('kebiasaan_id, status')
        .eq('siswa_id', studentId).eq('tanggal', dateStr).eq('peran_pencatat', 'siswa');
      const result = {};
      HABITS.forEach(h => { result[h.code] = 'belum_terbiasa'; });
      (data || []).forEach(row => { const kode = idToKode[row.kebiasaan_id]; if (kode) result[kode] = row.status; });
      return result;
    },
    async recordEntry(studentId, habitCode, recordedRole, status){
      const madrasahId = await getMadrasahId();
      const { kodeToId } = await getKebiasaanMap();
      const kebiasaanId = kodeToId[habitCode];
      if (!kebiasaanId) throw new Error(`Kebiasaan "${habitCode}" tidak ditemukan di tabel kebiasaan.`);
      return supabaseClient.from('jurnal_kebiasaan').upsert({
        madrasah_id: madrasahId, siswa_id: studentId, kebiasaan_id: kebiasaanId,
        tanggal: todayKey(), status: status || 'sudah_terbiasa', peran_pencatat: recordedRole
      }, { onConflict: 'siswa_id,kebiasaan_id,tanggal,peran_pencatat' });
    },
    async recordBulkEntries(dateStr, entriesByStudent, recordedRole){
      const madrasahId = await getMadrasahId();
      const { kodeToId } = await getKebiasaanMap();
      const rows = [];
      Object.keys(entriesByStudent).forEach(studentId => {
        Object.keys(entriesByStudent[studentId]).forEach(habitCode => {
          const kebiasaanId = kodeToId[habitCode];
          if (!kebiasaanId) return;
          rows.push({
            madrasah_id: madrasahId, siswa_id: studentId, kebiasaan_id: kebiasaanId,
            tanggal: dateStr, status: entriesByStudent[studentId][habitCode], peran_pencatat: recordedRole
          });
        });
      });
      if (rows.length === 0) return { ok:true };
      return supabaseClient.from('jurnal_kebiasaan').upsert(rows, { onConflict: 'siswa_id,kebiasaan_id,tanggal,peran_pencatat' });
    },
    async getStreak(studentId){
      const { data } = await supabaseClient.from('jurnal_kebiasaan')
        .select('tanggal, status')
        .eq('siswa_id', studentId).eq('peran_pencatat', 'siswa')
        .gte('tanggal', daysAgoKey(30)).order('tanggal', { ascending:false });
      const byDate = {};
      (data || []).forEach(r => { byDate[r.tanggal] = byDate[r.tanggal] || []; byDate[r.tanggal].push(r.status); });
      let streak = 0;
      for (let i = 0; i < 30; i++){
        const dateStr = daysAgoKey(i);
        const statuses = byDate[dateStr];
        if (!statuses || !statuses.some(s => s === 'sudah_terbiasa')) break;
        streak++;
      }
      return streak;
    },
    async getHabitConsistency(studentId){
      const { idToKode } = await getKebiasaanMap();
      const { data } = await supabaseClient.from('jurnal_kebiasaan')
        .select('tanggal, kebiasaan_id, status')
        .eq('siswa_id', studentId).eq('peran_pencatat', 'siswa')
        .gte('tanggal', daysAgoKey(30));
      const tally = {};
      HABITS.forEach(h => { tally[h.code] = { sudah:0, total:0 }; });
      const activeDates = new Set();
      (data || []).forEach(row => {
        const kode = idToKode[row.kebiasaan_id];
        if (!kode || !tally[kode]) return;
        tally[kode].total++;
        if (row.status === 'sudah_terbiasa') tally[kode].sudah++;
        activeDates.add(row.tanggal);
      });
      const consistency = {};
      let totalCatatan = 0;
      HABITS.forEach(h => {
        const t = tally[h.code];
        totalCatatan += t.total;
        consistency[h.code] = t.total > 0 ? Math.round((t.sudah / t.total) * 100) : 0;
      });
      return { consistency, totalCatatan, hariAktif: activeDates.size };
    },
    async getWeeklyActiveDays(studentId){
      const { data } = await supabaseClient.from('jurnal_kebiasaan')
        .select('tanggal').eq('siswa_id', studentId).gte('tanggal', daysAgoKey(7));
      return new Set((data || []).map(r => r.tanggal)).size;
    },
    async getMisiHariIni(studentId){
      const { data: misiRows } = await supabaseClient.from('misi_harian').select('id, judul, deskripsi, tanggal_aktif').eq('tanggal_aktif', todayKey());
      if (!misiRows || misiRows.length === 0) return MISI_HARIAN.map(m => ({ ...m, selesai:false }));
      const { data: selesaiRows } = await supabaseClient.from('misi_selesai').select('misi_id').eq('siswa_id', studentId);
      const selesaiIds = new Set((selesaiRows || []).map(r => r.misi_id));
      return misiRows.map(m => ({ id:m.id, judul:m.judul, deskripsi:m.deskripsi, icon:'🎯', selesai: selesaiIds.has(m.id) }));
    },
    async toggleMisi(studentId, misiId){
      const { data } = await supabaseClient.from('misi_selesai').select('id').eq('siswa_id', studentId).eq('misi_id', misiId).maybeSingle();
      if (data) await supabaseClient.from('misi_selesai').delete().eq('id', data.id);
      else await supabaseClient.from('misi_selesai').insert({ siswa_id: studentId, misi_id: misiId });
      return true;
    },
    async getSubIbadahToday(studentId){
      const { subIdToKode } = await getSubKebiasaanMap();
      const { data: subRows } = await supabaseClient.from('sub_kebiasaan').select('id, kode, nama, ikon');
      const { data: jurnalRows } = await supabaseClient.from('jurnal_sub_kebiasaan')
        .select('sub_kebiasaan_id, dilakukan').eq('siswa_id', studentId).eq('tanggal', todayKey());
      const doneMap = {};
      (jurnalRows || []).forEach(r => { doneMap[r.sub_kebiasaan_id] = r.dilakukan; });
      return (subRows && subRows.length > 0 ? subRows : SUB_IBADAH).map(s => ({
        code: s.kode, nama: s.nama, icon: s.ikon,
        dilakukan: !!doneMap[s.id]
      }));
    },
    async recordSubIbadahBulk(studentId, subEntries){
      const madrasahId = await getMadrasahId();
      const { subKodeToId } = await getSubKebiasaanMap();
      const rows = Object.keys(subEntries).map(code => ({
        madrasah_id: madrasahId, siswa_id: studentId, sub_kebiasaan_id: subKodeToId[code],
        tanggal: todayKey(), dilakukan: !!subEntries[code], peran_pencatat: 'siswa'
      })).filter(r => r.sub_kebiasaan_id);
      if (rows.length === 0) return { ok:true };
      return supabaseClient.from('jurnal_sub_kebiasaan').upsert(rows, { onConflict: 'siswa_id,sub_kebiasaan_id,tanggal' });
    }
  };
}

function getAdapter(){
  if (APP_MODE === 'demo') return makeDemoAdapter();
  if (typeof supabase === 'undefined'){
    console.error('Pustaka Supabase gagal dimuat -- kembali ke mode demo.');
    return makeDemoAdapter();
  }
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  if (APP_MODE === 'standalone') return makeStandaloneAdapter(client);
  if (APP_MODE === 'amanah') return makeAmanahAdapter(client);
  return makeDemoAdapter();
}

  useEffect(() => {

    adapter.getSubIbadahToday(student.id).then(list => {

      setSubLoaded(true);

function RadarChart({ data, size = 340 }){
  // data: [{ label, value (0-100), color }]
  const center = size / 2;
  const radius = size / 2 - 85; // margin besar khusus supaya label tidak kepotong tepi
  const n = data.length;
  const angleFor = (i) => (Math.PI * 2 * i) / n - Math.PI / 2;
  const pointFor = (i, value) => {
    const r = (value / 100) * radius;
    const a = angleFor(i);
    return [center + r * Math.cos(a), center + r * Math.sin(a)];
  };
  const polygonPoints = data.map((d, i) => pointFor(i, d.value).join(',')).join(' ');
  const rings = [25, 50, 75, 100];

  return (
    <svg viewBox={`0 0 ${size} ${size}`} width="100%" style={{maxWidth:size, display:'block', margin:'0 auto'}}>
      {rings.map(r => {
        const pts = data.map((_, i) => pointFor(i, r).join(',')).join(' ');
        return <polygon key={r} points={pts} fill="none" stroke="var(--border)" strokeWidth="1" />;
      })}
      {data.map((d, i) => {
        const [x, y] = pointFor(i, 100);
        return <line key={i} x1={center} y1={center} x2={x} y2={y} stroke="var(--border)" strokeWidth="1" />;
      })}
      <polygon points={polygonPoints} fill="var(--green-600)" fillOpacity="0.35" stroke="var(--green-700)" strokeWidth="2" />
      {data.map((d, i) => {
        const [x, y] = pointFor(i, d.value);
        return <circle key={i} cx={x} cy={y} r="3.5" fill="var(--green-700)" />;
      })}
      {data.map((d, i) => {
        const [lx, ly] = pointFor(i, 122);
        const words = d.label.split(' ').slice(0, 2); // maksimal 2 baris biar tidak kepanjangan
        return (
          <text key={i} x={lx} y={ly} fontSize="9.5" fontWeight="700" fill="var(--ink-soft)" textAnchor="middle" dominantBaseline="middle">
            <tspan x={lx} dy="-6">{d.icon}</tspan>
            {words.map((w, wi) => (
              <tspan key={wi} x={lx} dy={wi === 0 ? 12 : 11}>{w}</tspan>
            ))}
          </text>
        );
      })}
    </svg>
  );
}

const STATUS_LABEL_PERSEN = (pct) => {
  if (pct >= 80) return { label:'Sangat Baik', color:'var(--green-600)', dot:'🟢' };
  if (pct >= 40) return { label:'Perlu Penguatan', color:'var(--gold-600)', dot:'🟡' };
  return { label:'Perlu Pendampingan', color:'var(--rust-500)', dot:'🔴' };
};

const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

    adapter.listKelasForMadrasah().then(list => {
      // Kepala madrasah/admin lihat semua kelas. Guru/wali kelas biasa
      // cuma lihat kelas yang wali_kelas_id-nya cocok dengan dirinya --
      // pembatasan ini di level tampilan (belum di RLS, sesuai keputusan
      // "biarkan longgar dulu" untuk login yang belum pakai auth sungguhan).
      const filtered = isAdmin ? list : list.filter(k => k.wali_kelas_id === pegawai.id);
      setKelasList(filtered);
      setLoading(false);
    });

  return (
    <div className="phone-screen">
      <div className="app-header">
        <button className="back-btn" onClick={onBack} aria-label="Kembali">←</button>
        <p className="eyebrow">Selasa, 25 Agustus 2026</p>
        <h1>Selamat datang, {pegawai.nama.split(',')[0]}</h1>
        <p className="sub">Gerakan 7 Kebiasaan Anak Indonesia Hebat · TP 2026/2027</p>
      </div>
      <div className="content-pad">
        {isAdmin && (
          <div className="habit-card" style={{background:'var(--gold-100)', marginBottom:12}} onClick={onOpenAnalisis}>
            <div className="habit-icon" style={{background:'var(--gold-400)', color:'var(--gold-800)'}}>📊</div>
            <div className="habit-body">
              <p className="habit-name">Analisis Pembiasaan</p>
              <p className="habit-status" style={{color:'var(--gold-800)'}}>Radar 7 kebiasaan, kelengkapan monitoring</p>
            </div>
          </div>
        )}
        {isAdmin && (
          <div className="habit-card" style={{background:'var(--teal-100)', marginBottom:12}} onClick={onOpenRekapBulanan}>
            <div className="habit-icon" style={{background:'var(--teal-700)', color:'white'}}>📅</div>
            <div className="habit-body">
              <p className="habit-name">Rekap Bulanan</p>
              <p className="habit-status" style={{color:'var(--teal-700)'}}>Indeks konsistensi per bulan, per kelas</p>
            </div>
          </div>
        )}
        {isAdmin && (
          <div className="habit-card" style={{background:'var(--sage-100)', marginBottom:18}} onClick={onOpenLaporan}>
            <div className="habit-icon" style={{background:'var(--sage-700)', color:'white'}}>🖨️</div>
            <div className="habit-body">
              <p className="habit-name">Laporan</p>
              <p className="habit-status" style={{color:'var(--sage-700)'}}>Cetak / unduh PDF laporan harian & bulanan</p>
            </div>
          </div>
        )}
        <p className="section-title">Monitoring per kelas</p>
        {loading && <p style={{fontSize:12.5, color:'var(--ink-faint)'}}>Memuat daftar kelas...</p>}
        {!loading && kelasList.length === 0 && !isAdmin && (
          <p style={{fontSize:12.5, color:'var(--ink-faint)'}}>Belum ada kelas yang diampu tercatat atas nama Anda di sistem. Hubungi admin madrasah untuk memastikan wali_kelas_id sudah diisi.</p>
        )}
        {!loading && kelasList.length === 0 && isAdmin && (
          <p style={{fontSize:12.5, color:'var(--ink-faint)'}}>Belum ada data kelas ditemukan untuk madrasah ini.</p>
        )}
        {kelasList.map(k => (
          <div key={k.id} className="habit-card" style={{background:'var(--paper)'}} onClick={() => onOpenMonitoring(k)}>
            <div className="habit-icon" style={{background:'var(--green-700)', color:'white', fontWeight:700, fontSize: (k.paralel && k.paralel.length > 2) ? 13 : 16}}>{k.tingkat}{k.paralel && k.paralel.length <= 2 ? k.paralel : ''}</div>
            <div className="habit-body">
              <p className="habit-name">Kelas {formatKelas(k.tingkat, k.paralel)}</p>
              <p className="habit-status" style={{color:'var(--ink-soft)'}}>Ketuk untuk buka monitoring</p>
            </div>
          </div>
        ))}
        {isAdmin && kelasList.length > 0 && (
          <div className="lead-note" style={{marginTop:14}}>
            Anda masuk sebagai {pegawai.jabatan} — bisa lihat monitoring semua kelas. Guru/wali kelas biasa cuma lihat kelas yang wali_kelas_id-nya cocok dengan mereka.
          </div>
        )}
      </div>
    </div>
  );
}

function GuruScreen({ adapter, pegawai, kelas, onToast, onBack }){
  const [roster, setRoster] = useState([]);
  const [entriesByStudent, setEntriesByStudent] = useState({});
  const [dirtyKeys, setDirtyKeys] = useState(() => new Set());
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [selectedDate, setSelectedDate] = useState(new Date().toISOString().slice(0,10));

  // Guru mengisi SEMUA kebiasaan hari itu (bukan cuma ranah madrasah) --
  // meniru pola SI-7KAIH: input massal per kelas untuk seluruh 7 kebiasaan,
  // berguna khususnya untuk MI yang belum tentu punya app Ortu aktif.
  const refresh = (dateStr) => {
    setLoading(true);
    setDirtyKeys(new Set()); // reset penanda "disentuh" setiap ganti tanggal
    adapter.listClassRoster(kelas ? kelas.id : null).then(async list => {
      setRoster(list);
      const all = {};
      for (const s of list){
        all[s.id] = await adapter.getEntriesForDate(s.id, dateStr);
      }
      setEntriesByStudent(all);
      setLoading(false);
    });
  };

  useEffect(() => { refresh(selectedDate); }, [selectedDate]);

  const cycleStatus = (studentId, habitCode) => {
    setEntriesByStudent(prev => {
      const current = (prev[studentId] || {})[habitCode] || 'belum_terbiasa';
      return { ...prev, [studentId]: { ...prev[studentId], [habitCode]: nextStatus(current) } };
    });
    // Tandai sel ini SUNGGUH disentuh guru -- cuma yang ditandai ini yang
    // boleh ikut tersimpan. Nilai default tampilan (belum diklik sama
    // sekali) TIDAK boleh ikut kesimpan sebagai observasi sungguhan.
    setDirtyKeys(prev => new Set(prev).add(`${studentId}__${habitCode}`));
  };

  const handleSaveAll = async () => {
    if (dirtyKeys.size === 0){
      onToast('Belum ada sel yang diklik -- tidak ada yang disimpan');
      return;
    }
    setSaving(true);
    // Susun payload HANYA dari sel yang benar-benar disentuh (dirtyKeys),
    // bukan seluruh entriesByStudent (yang berisi juga nilai default tampilan).
    const payload = {};
    dirtyKeys.forEach(key => {
      const [studentId, habitCode] = key.split('__');
      if (!payload[studentId]) payload[studentId] = {};
      payload[studentId][habitCode] = entriesByStudent[studentId][habitCode];
    });
    await adapter.recordBulkEntries(selectedDate, payload, 'guru');
    setSaving(false);
    setDirtyKeys(new Set());
    onToast(`Tersimpan: ${Object.keys(payload).length} siswa yang diubah`);
  };

  const lengkapCount = roster.filter(s => {
    const e = entriesByStudent[s.id] || {};
    return HABITS.every(h => e[h.code] === 'sudah_terbiasa');
  }).length;

  return (
    <div className="dash">
      <div className="dash-header">
        <div>
          <button className="back-btn" onClick={onBack} aria-label="Kembali" style={{marginBottom:8}}>←</button>
          <h1>Monitoring 7 Kebiasaan</h1>
          <p className="sub">{kelas ? `Kelas ${formatKelas(kelas.tingkat, kelas.paralel)} · ` : ''}{pegawai ? `${pegawai.nama}` : ''} — input massal per kelas</p>
        </div>
        <div style={{textAlign:'right'}}>
          <p style={{margin:0, fontSize:12, color:'var(--gold-200)'}}>Tanggal</p>
          <input type="date" value={selectedDate} onChange={e => setSelectedDate(e.target.value)}
            style={{marginBottom:0, width:'auto', background:'rgba(255,255,255,0.12)', border:'1px solid rgba(255,255,255,0.25)', color:'var(--cream)', colorScheme:'dark'}} />
        </div>
      </div>
      <div className="dash-body">
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16, flexWrap:'wrap', gap:10}}>
          <p style={{fontSize:13, color:'var(--ink-soft)', margin:0}}>
            {roster.length} siswa · <strong style={{color:'var(--green-700)'}}>{lengkapCount}/{roster.length} lengkap</strong> · klik titik untuk ubah status (belum → perlu dampingan → sudah terbiasa). Titik pudar = belum disentuh, tidak akan tersimpan.
          </p>
          <button className="btn btn-primary" style={{width:'auto', margin:0, padding:'10px 20px'}} onClick={handleSaveAll} disabled={saving || dirtyKeys.size === 0}>
            {saving ? 'Menyimpan...' : `Simpan ${dirtyKeys.size > 0 ? `(${dirtyKeys.size} sel)` : 'semua'}`}
          </button>
        </div>

        {loading ? <p style={{fontSize:13, color:'var(--ink-faint)'}}>Memuat...</p> : (
          <div style={{overflowX:'auto'}}>
            <table className="dash-table">
              <thead>
                <tr>
                  <th style={{minWidth:150}}>Nama siswa</th>
                  {HABITS.map(h => <th key={h.code} style={{textAlign:'center', minWidth:64}}>{h.icon}<br/>{h.name.split(' ')[0]}</th>)}
                </tr>
              </thead>
              <tbody>
                {roster.map(s => {
                  const e = entriesByStudent[s.id] || {};
                  return (
                    <tr key={s.id}>
                      <td style={{fontWeight:600}}>{s.full_name}</td>
                      {HABITS.map(h => {
                        const status = e[h.code] || 'belum_terbiasa';
                        const level = STATUS_LEVELS.find(l => l.value === status);
                        const touched = dirtyKeys.has(`${s.id}__${h.code}`);
                        return (
                          <td key={h.code} style={{textAlign:'center'}}>
                            <button onClick={() => cycleStatus(s.id, h.code)} aria-label={`${h.name}: ${level.label}${touched ? ' (akan disimpan)' : ''}`}
                              title={touched ? `${level.label} -- akan disimpan` : `${level.label} -- belum disentuh, TIDAK akan disimpan`}
                              style={{
                                width:22, height:22, borderRadius:'50%', cursor:'pointer',
                                background:level.color, padding:0,
                                border: touched ? '2.5px solid var(--ink)' : '2px solid transparent',
                                opacity: touched ? 1 : 0.45
                              }} />
                          </td>
                        );
                      })}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}

        <div style={{display:'flex', gap:16, marginTop:18, fontSize:12, color:'var(--ink-soft)'}}>
          {STATUS_LEVELS.map(l => (
            <div key={l.value} style={{display:'flex', alignItems:'center', gap:6}}>
              <span style={{width:12, height:12, borderRadius:'50%', background:l.color, display:'inline-block'}}></span>{l.label}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function App(){
  const adapter = useMemo(() => getAdapter(), []);
  const [step, setStep] = useState(adapter.needsInstitutionPick ? 'pick-institution' : 'login');
  const [institution, setInstitution] = useState(null);
  const [student, setStudent] = useState(null);
  const [pegawai, setPegawai] = useState(null);
  const [selectedKelas, setSelectedKelas] = useState(null);
  const [namaKanwil, setNamaKanwil] = useState('');
  const [toast, setToast] = useState('');

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2200); };

  const handleSelectRole = (role) => {
    if (role === 'siswa') setStep('pick-student');
    else if (role === 'ortu') setStep('ortu');
    else if (role === 'guru') setStep('pick-pegawai');
  };

  return (
    <React.Fragment>
      {step === 'pick-institution' ? (
        <div className="phone">
          <InstitutionPicker adapter={adapter} onPick={(inst) => { setInstitution(inst); setStep('login'); }} onKanwil={() => setStep('kanwil-login')} />
        </div>
      ) : step === 'kanwil-login' ? (
        <div className="phone">
          <KanwilLoginScreen onSubmit={(nama) => { setNamaKanwil(nama); setStep('kanwil-dashboard'); }} onBack={() => setStep('pick-institution')} />
        </div>
      ) : step === 'kanwil-dashboard' ? (
        <div style={{width:'100%', maxWidth:980}}>
          <KanwilDashboard adapter={adapter} namaAdmin={namaKanwil} onBack={() => setStep('pick-institution')} />
        </div>
      ) : step === 'monitoring' ? (
        <div style={{width:'100%', maxWidth:980}}>
          <GuruScreen adapter={adapter} pegawai={pegawai} kelas={selectedKelas} onToast={showToast} onBack={() => setStep('pegawai-dashboard')} />
        </div>
      ) : step === 'analisis' ? (
        <div style={{width:'100%', maxWidth:980}}>
          <KepalaMadrasahDashboard adapter={adapter} pegawai={pegawai} onBack={() => setStep('pegawai-dashboard')} />
        </div>
      ) : step === 'rekap-bulanan' ? (
        <div style={{width:'100%', maxWidth:980}}>
          <RekapBulananScreen adapter={adapter} pegawai={pegawai} onBack={() => setStep('pegawai-dashboard')} />
        </div>
      ) : step === 'laporan' ? (
        <div style={{width:'100%', maxWidth:980}}>
          <LaporanScreen adapter={adapter} pegawai={pegawai} onBack={() => setStep('pegawai-dashboard')} />
        </div>
      ) : (
        <div className="phone">
          {step === 'login' && <LoginScreen onSelectRole={handleSelectRole} adapter={adapter} institution={institution} onChangeInstitution={adapter.needsInstitutionPick ? () => setStep('pick-institution') : null} />}
          {step === 'pick-student' && <StudentPicker adapter={adapter} onPick={(s) => { setStudent(s); setStep('jurnal'); }} onBack={() => setStep('login')} />}
          {step === 'jurnal' && student && <SiswaJurnal adapter={adapter} student={student} onToast={showToast} onBack={() => { setStudent(null); setStep('login'); }} />}
          {step === 'ortu' && <OrtuScreen adapter={adapter} onToast={showToast} onBack={() => setStep('login')} />}
          {step === 'pick-pegawai' && <PegawaiPicker adapter={adapter} onPick={(p) => { setPegawai(p); setStep('pegawai-dashboard'); }} onBack={() => setStep('login')} />}
          {step === 'pegawai-dashboard' && pegawai && <PegawaiDashboard adapter={adapter} pegawai={pegawai} onToast={showToast} onBack={() => { setPegawai(null); setStep('login'); }} onOpenMonitoring={(k) => { setSelectedKelas(k); setStep('monitoring'); }} onOpenAnalisis={() => setStep('analisis')} onOpenRekapBulanan={() => setStep('rekap-bulanan')} onOpenLaporan={() => setStep('laporan')} />}
        </div>
      )}
      <Toast message={toast} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
